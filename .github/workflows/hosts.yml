name: host probe

# Which macOS runner labels exist, which have `aa` (needed to decode LZRaven/pbzm OTA payloads),
# and what does each host's own /usr/libexec/srp-mdns-proxy look like?
#
# macos-15 is kept deliberately as a POSITIVE CONTROL: the SRP compression decoder is not built
# on the macOS 15 train at all, so a "no srpk symbols" result there is the expected negative and
# proves the check itself works. Never read a negative on a new host without it.
#
# An unallocatable label is cancelled by GitHub after ~15 min with no runner and zero steps; that
# is the signal the label does not exist for this account. fail-fast is off so one bad label does
# not kill the others.

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        label: [macos-27, macos-26, macos-15]
    runs-on: ${{ matrix.label }}
    timeout-minutes: 25
    steps:
      - name: Identify host
        run: |
          set -x
          mkdir -p out
          echo "requested label: ${{ matrix.label }}" | tee out/host.txt
          sw_vers | tee -a out/host.txt
          uname -m | tee -a out/host.txt
          df -h / | tail -1 | tee -a out/host.txt

      - name: Is `aa` present (LZRaven decode capability)
        run: |
          set -x
          { which aa && aa --help 2>&1 | head -3; } | tee -a out/host.txt || echo "aa ABSENT" | tee -a out/host.txt
          { which compression_tool && echo compression_tool present; } | tee -a out/host.txt || true

      - name: The host's own srp-mdns-proxy
        run: |
          set -x
          B=/usr/libexec/srp-mdns-proxy
          if [ ! -f "$B" ]; then echo "daemon ABSENT on this host" | tee -a out/host.txt; exit 0; fi
          ls -l "$B"            | tee -a out/host.txt
          shasum -a 256 "$B"    | tee -a out/host.txt
          lipo -info "$B"       | tee -a out/host.txt
          ARCH=$(lipo -info "$B" | sed 's/.*: //' | awk '{print $NF}')
          T="$B"
          if lipo -info "$B" | grep -q '^Architectures in the fat file'; then
            lipo -thin "$ARCH" "$B" -output out/thin.bin && T=out/thin.bin
          fi
          echo "slice: $ARCH" | tee -a out/host.txt
          # the decoder gate
          N=$(nm -a "$T" 2>/dev/null | grep -c srpk || true)
          echo "srpk symbols: $N" | tee -a out/host.txt
          nm -a "$T" 2>/dev/null | grep srpk | tee -a out/host.txt || true
          strings -a "$T" | grep -c 'underline-char-ptr' | sed 's/^/underline-char-ptr hits: /' | tee -a out/host.txt || true
          # if the decoder is here, is the 27.0.1 offset bound present?
          if [ "$N" -gt 0 ]; then
            otool -tvV "$T" > out/text.tmp 2>&1 || true
            awk '/^_srpk_label_from_wire_:$/{f=1} f{print} f&&/^_[A-Za-z_0-9.]+:$/&&!/_srpk_label_from_wire_:/{exit}' \
                out/text.tmp > out/lfw.txt || true
            {
              echo "--- _srpk_label_from_wire_ ---"
              echo "instructions: $(grep -cE '^[0-9a-f]{16}' out/lfw.txt)"
              echo "loads of txn->lim  (ldr [xN,#0x10]) : $(grep -cE 'ldr[[:space:]]+x[0-9]+, \[x[0-9]+, #0x10\]' out/lfw.txt)"
              echo "offset-vs-extent shape (sub then cmp then b.hi):"
              grep -nE '[[:space:]](sub|cmp|b\.hi)[[:space:]]' out/lfw.txt | head -25
              echo "--- context at each integer-reader call ---"
              for N2 in $(grep -nE 'bl.*_srpk_integer_from_wire_max_' out/lfw.txt | cut -d: -f1); do
                echo "### site at line $N2"
                sed -n "${N2},$((N2+12))p" out/lfw.txt
              done
            } | tee out/bound.txt
            rm -f out/text.tmp out/lfw.txt out/thin.bin
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-${{ matrix.label }}
          path: out/**
          if-no-files-found: warn
